# electron-builder 配置：与 package.json 中 build 字段二选一；此处独立文件便于维护
# 公开发布的安装包不得包含任何凭据（GitHub Token、NAS 账号、服务器地址等），
# 这些都在首次启动后由用户在「桌面设置」中填写。
appId: com.lightcontent.material-assistant
productName: sig-dream
copyright: Copyright © 2026 ChenShuo2004 and sig-dream contributors

directories:
  output: release
  buildResources: assets

files:
  - dist/**/*
  - electron/**/*
  - package.json
  - "!**/*.map"

extraResources:
  - from: local.settings.example.json
    to: local.settings.example.json
  - from: ensure-nas-smb.ps1
    to: ensure-nas-smb.ps1
  - from: resolve-nas-smb.ps1
    to: resolve-nas-smb.ps1
  - from: _nas-share-map.ps1
    to: _nas-share-map.ps1
  - from: 映射NAS-Z盘.example.bat
    to: 映射NAS-Z盘.example.bat

asar: true

win:
  icon: assets/icon.png
  # 无签名证书时禁用可执行文件签名编辑（避免 winCodeSign 解压失败）
  signAndEditExecutable: false
  target:
    - target: nsis
      arch:
        - x64
    - target: zip
      arch:
        - x64
  artifactName: sig-dream-${version}-win-${arch}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: ${productName}
  artifactName: sig-dream-${version}-win-${arch}-setup.${ext}

mac:
  icon: assets/icon.png
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  category: public.app-category.productivity
  artifactName: sig-dream-${version}-mac-${arch}.${ext}
  hardenedRuntime: true
  gatekeeperAssess: false

dmg:
  title: ${productName} ${version}

linux:
  icon: assets/icon.png
  category: Graphics
  synopsis: sig画布 desktop client
  maintainer: ChenShuo2004 <220584709+ChenShuo2004@users.noreply.github.com>
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  artifactName: sig-dream-${version}-linux-${arch}.${ext}

# GitHub Releases 自动更新：公开仓库，客户端无需 Token
publish:
  provider: github
  owner: ChenShuo2004
  repo: sig-dream
  releaseType: release
