name: Desktop release

# 推送 v* 标签（版本号需与 desktop-client/package.json 一致）时构建三端安装包并发布到 GitHub Releases；
# 手动运行时只构建，产物在本次运行的 Artifacts 中下载。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            target: --win
          - name: macOS
            os: macos-latest
            target: --mac
          - name: Linux
            os: ubuntu-latest
            target: --linux
    defaults:
      run:
        working-directory: desktop-client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop-client/package-lock.json

      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag v$tag does not match desktop-client/package.json version $pkg"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci
        env:
          # desktop-client/.npmrc 的国内镜像只用于本地；CI 直接从官方源下载 Electron
          npm_config_electron_mirror: ""

      - name: Build renderer
        run: npm run build

      - name: Package
        run: npx electron-builder ${{ matrix.target }} --config electron-builder.yml --publish never
        env:
          # 未配置签名证书：跳过自动查找，生成未签名安装包
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          npm_config_electron_mirror: ""

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sig-dream-desktop-${{ matrix.name }}
          path: |
            desktop-client/release/*.exe
            desktop-client/release/*.dmg
            desktop-client/release/*.zip
            desktop-client/release/*.AppImage
            desktop-client/release/*.deb
            desktop-client/release/*.blockmap
            desktop-client/release/latest*.yml
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -la dist
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "sig-dream $GITHUB_REF_NAME" \
            --notes "桌面客户端安装包：Windows（.exe 安装版 / .zip 便携版）、macOS（Intel x64 / Apple Silicon arm64 的 .dmg）、Linux（.AppImage / .deb）。安装包未签名，首次打开请参考 README 中的「桌面客户端」说明。"
