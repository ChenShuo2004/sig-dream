name: Release

# 推送 v* 标签（版本号需与 package.json / VERSION / desktop/package.json 一致，可用 npm run version:sync -- x.y.z 同步）时自动构建：
# 1. 类型检查 + 单元测试 + 开箱即用 Web 便携包（免 npm install，解压双击即用）
# 2. macOS (arm64/x64) / Windows (x64) / Linux (x64) 社区版原生桌面安装包（复用同一份前端构建产物）
# 3. 自动生成 SHA256SUMS 校验文件与版本更新说明，发布到 GitHub Releases。
# 手动触发（workflow_dispatch）时只构建产物并上传到本次运行的 Artifacts。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-and-portable:
    name: Checks & Web Portable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify version consistency
        shell: bash
        run: |
          root_pkg="$(node -p "require('./package.json').version")"
          desktop_pkg="$(node -p "require('./desktop/package.json').version")"
          version_file="$(tr -d '[:space:]' < VERSION)"
          if [ "$root_pkg" != "$desktop_pkg" ] || [ "v$root_pkg" != "$version_file" ]; then
            echo "::error::Version mismatch: package.json=$root_pkg, desktop/package.json=$desktop_pkg, VERSION=$version_file"
            exit 1
          fi
          if [[ "${GITHUB_REF:-}" == refs/tags/v* ]]; then
            tag="${GITHUB_REF_NAME#v}"
            if [ "$tag" != "$root_pkg" ]; then
              echo "::error::Git tag v$tag does not match package.json version $root_pkg"
              exit 1
            fi
          fi

      - name: Install dependencies
        shell: bash
        run: |
          npm ci --no-audit --no-fund

      - name: Run typecheck & unit tests
        run: |
          npm run verify:release
          npm run typecheck
          npm test
          npm audit --audit-level=moderate

      - name: Build web app & portable package
        run: npm run build:portable

      - name: Install test browser
        run: npx playwright install --with-deps chromium

      - name: Verify Agent setup and real MCP bridge
        run: |
          npm run test:agent:ui
          npm run test:agent:bridge
          npm run test:portable
          npm run test:public

      - name: Upload built dist bundle for desktop jobs
        uses: actions/upload-artifact@v4
        with:
          name: sig-dream-web-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

      - name: Upload portable artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sig-dream-web-portable
          path: |
            release/sig-dream-*-web-portable.zip
            release/sig-dream-*-web-portable.tar.gz
            release/sig-dream-canvas-agent-*.tgz
          if-no-files-found: error
          retention-days: 14

  desktop:
    name: Desktop (${{ matrix.name }})
    needs: verify-and-portable
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS-arm64
            os: macos-15
            script: dist:mac:arm64
            args: --mac --arm64
            executable: desktop/release/mac-arm64/sig-dream.app/Contents/MacOS/sig-dream
            artifacts: |
              desktop/release/*.dmg
              desktop/release/*.zip
          - name: macOS-x64
            os: macos-15-intel
            script: dist:mac:x64
            args: --mac --x64
            executable: desktop/release/mac/sig-dream.app/Contents/MacOS/sig-dream
            artifacts: |
              desktop/release/*.dmg
              desktop/release/*.zip
          - name: Windows
            os: windows-latest
            script: dist:win
            args: --win --x64
            executable: desktop/release/win-unpacked/sig-dream.exe
            artifacts: |
              desktop/release/*.exe
              desktop/release/*.zip
          - name: Linux
            os: ubuntu-latest
            script: dist:linux
            args: --linux --x64
            executable: desktop/release/linux-unpacked/sig-dream
            artifacts: |
              desktop/release/*.AppImage
              desktop/release/*.deb
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download prebuilt web dist
        uses: actions/download-artifact@v4
        with:
          name: sig-dream-web-dist
          path: dist

      - name: Install root test dependencies and build maintained Agent
        run: |
          npm ci --no-audit --no-fund
          npm run build:agent

      - name: Install desktop dependencies
        working-directory: desktop
        shell: bash
        run: |
          npm ci --no-audit --no-fund
        env:
          npm_config_electron_mirror: ""

      - name: Audit desktop dependencies
        working-directory: desktop
        run: npm audit --audit-level=moderate

      - name: Package desktop installer (${{ matrix.name }})
        run: node desktop/scripts/package-release.mjs ${{ matrix.args }}
        env:
          SIG_DREAM_REQUIRE_SIGNING: ${{ vars.SIG_DREAM_REQUIRE_SIGNING || '0' }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          npm_config_electron_mirror: ""

      - name: Verify Linux installer files
        if: runner.os == 'Linux'
        shell: bash
        run: |
          test -n "$(find desktop/release -maxdepth 1 -type f -name 'sig-dream-*-linux-x86_64.AppImage' -print -quit)"
          test -n "$(find desktop/release -maxdepth 1 -type f -name 'sig-dream-*-linux-amd64.deb' -print -quit)"

      - name: Launch packaged desktop app (macOS / Windows)
        if: runner.os != 'Linux'
        run: npm run test:desktop -- "${{ matrix.executable }}"

      - name: Upload desktop validation evidence
        if: runner.os != 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-validation-${{ matrix.name }}
          path: release/agent-connections/
          if-no-files-found: error

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sig-dream-desktop-${{ matrix.name }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
          retention-days: 14

  docker:
    name: Docker runtime and access control
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and validate container
        shell: bash
        run: |
          docker build -t sig-dream-check .
          password="$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          docker run -d --name sig-dream-check -p 127.0.0.1:3000:3000 -e SIG_DREAM_ACCESS_PASSWORD="$password" sig-dream-check
          for attempt in {1..60}; do
            if curl -fsS http://127.0.0.1:3000/healthz; then break; fi
            sleep 2
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/)" = "401"
          test "$(curl -s -u "sig-dream:$password" -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/)" = "200"
          docker stop sig-dream-check

  publish:
    name: Publish GitHub Release
    needs:
      - verify-and-portable
      - desktop
      - docker
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: sig-dream-*
          path: release-assets-raw
          merge-multiple: false

      - name: Collect release binaries & generate SHA256SUMS
        shell: bash
        run: |
          mkdir -p release-assets
          find release-assets-raw -mindepth 2 -maxdepth 2 -type f \
            ! -path "*/sig-dream-web-dist/*" \
            -exec cp -v {} release-assets/ \;
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Generate release notes
        shell: bash
        run: |
          changelog_section="$(awk -v ver="${GITHUB_REF_NAME}" '
            $0 ~ "^## " ver "([[:space:]]|$)" { found=1; next }
            found && /^## v[0-9]/ { exit }
            found { print }
          ' CHANGELOG.md | sed '/./,$!d')"

          {
            echo "## sig-dream ${GITHUB_REF_NAME} · 开箱即用社区开源版"
            echo ""
            echo "> 零数据库、本地优先的 AI 无限画布与视频创作工作室（内置 **无限画布 / 剧本工作室 / 复刻工作室 / 替换工作室 / 1700+ 提示词库**）。"
            echo "> 无需 PostgreSQL、Redis 或登录服务，所有画布工程、本地资产与 API Key 均保存在本机。"
            echo ""
            if [ -n "$changelog_section" ]; then
              echo "### ✨ 本次更新"
              echo ""
              echo "$changelog_section"
              echo ""
            fi
            cat <<'EOF'
          ### 📦 下载选择指南

          | 平台 / 使用方式 | 推荐下载文件 | 说明 |
          | --- | --- | --- |
          | **macOS（Apple Silicon M1–M4）** | `sig-dream-*-mac-arm64.dmg` | 独立桌面版，无需安装 Node.js，拖入应用程序即用 |
          | **macOS（Intel 芯片）** | `sig-dream-*-mac-x64.dmg` | 独立桌面版，无需安装 Node.js，打开即用 |
          | **Windows（x64）** | `sig-dream-*-win-x64-setup.exe` 或 `sig-dream-*-win-x64.zip` | 安装版或免安装便携版，无需 Node.js |
          | **Linux（x64）** | `sig-dream-*-linux-x86_64.AppImage` 或 `sig-dream-*-linux-amd64.deb` | 独立桌面版 |
          | **Web 开箱即用便携包（跨平台）** | `sig-dream-*-web-portable.zip` / `.tar.gz` | 免 `npm install`，仅需 Node.js 20+，解压双击脚本自动启动并打开浏览器 |
          | **完整性校验** | `SHA256SUMS.txt` | 各安装包 SHA-256 校验值 |

          ### ⚠️ 首次打开提示（未签名安装包）

          开源社区版安装包未配置付费代码签名证书，首次打开时如遇系统安全拦截：
          - **macOS**：若提示「已损坏」或「无法验证开发者」，请右键点击应用选「打开」，或在终端执行：`xattr -cr /Applications/sig-dream.app`
          - **Windows**：若 SmartScreen 提示保护电脑，点击「更多信息」→「仍要运行」即可。

          ### 🚀 三步上手

          1. 启动应用（桌面端直接打开；Web 便携包双击对应系统启动脚本）。
          2. 点击右上角 **⚙️ 模型渠道与设置**，填入任意 OpenAI 兼容 / Gemini / DeepSeek / 火山引擎 Seedance / RunningHub 渠道与 API Key。
          3. 从首页直接进入 **无限画布** 或 **剧本 / 复刻 / 替换工作室** 开始创作。
          EOF
          } | sed 's/^          //' > release-notes.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -lh release-assets
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release already exists; choose a new version instead of overwriting artifacts."
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "sig-dream $GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --draft
