<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: "SigCJK";
          src: local("PingFang SC"), local("Hiragino Sans GB"), local("STHeiti");
          font-weight: 400 900;
        }
        #root {
          position: absolute; inset: 0; overflow: hidden;
          background: radial-gradient(circle at 68% 50%, #1c1036 0%, #06050c 54%, #020204 100%);
          font-family: Inter, "SigCJK", sans-serif; color: #ffffff;
          perspective: 1600px;
        }
        #head {
          position: absolute; left: 110px; top: 52px; right: 110px;
          display: flex; align-items: center; justify-content: space-between; z-index: 20;
        }
        .kicker {
          padding: 8px 20px; border-radius: 999px;
          background: rgba(139, 92, 246, 0.22); border: 1px solid rgba(167, 139, 250, 0.5);
          color: #d8b4fe; font-size: 26px; font-weight: 700;
        }
        .htitle { font-size: 46px; font-weight: 900; letter-spacing: -0.03em; }
        .glow {
          background: linear-gradient(90deg, #c084fc 0%, #38bdf8 100%);
          -webkit-background-clip: text; color: transparent;
        }
        #left {
          position: absolute; left: 110px; top: 155px; width: 670px;
          display: flex; flex-direction: column; gap: 18px; transform-style: preserve-3d;
        }
        #ui-box {
          height: 390px; border-radius: 22px; overflow: hidden;
          border: 1.5px solid rgba(167, 139, 250, 0.35);
          box-shadow: 0 32px 90px rgba(0, 0, 0, 0.85);
        }
        #ui-box img { width: 100%; height: 100%; object-fit: cover; }
        #thumbs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; height: 165px; }
        .t {
          border-radius: 14px; overflow: hidden;
          border: 1px solid rgba(167, 139, 250, 0.35);
          box-shadow: 0 16px 36px rgba(0, 0, 0, 0.7);
        }
        .t img { width: 100%; height: 100%; object-fit: cover; }
        #note {
          padding: 22px 26px; border-radius: 18px;
          background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(167, 139, 250, 0.25);
          font-size: 26px; line-height: 1.48; color: #d4d4d8;
        }
        #note b { color: #ffffff; }
        #right-vid {
          position: absolute; right: 90px; top: 155px; width: 1000px; height: 820px;
          border-radius: 26px; overflow: hidden;
          border: 1.5px solid rgba(167, 139, 250, 0.4);
          box-shadow: 0 44px 120px rgba(0, 0, 0, 0.9), 0 0 80px rgba(139, 92, 246, 0.22);
        }
        #right-vid video { width: 100%; height: 100%; object-fit: cover; }
        .vtag {
          position: absolute; left: 24px; bottom: 24px; padding: 10px 22px; border-radius: 12px;
          background: rgba(5, 5, 10, 0.84); border: 1px solid rgba(255, 255, 255, 0.16);
          font-size: 26px; font-weight: 700;
        }
      </style>

      <div id="root" data-composition-id="s5-script-studio" data-start="0" data-duration="8.5" data-width="1920" data-height="1080">
        <div id="head">
          <div class="kicker">04 / 07 · 剧本工作室</div>
          <div class="htitle">10 万字剧本 → 2K 设定 → <span class="glow">逐集分镜成片</span></div>
        </div>

        <div id="left">
          <div id="ui-box"><img src="assets/ui/studio-script-dark.png" alt="script studio dark" /></div>
          <div id="thumbs">
            <div class="t"><img src="assets/studio/script-char-1.png" /></div>
            <div class="t"><img src="assets/studio/script-char-2.png" /></div>
            <div class="t"><img src="assets/studio/script-scene-1.png" /></div>
            <div class="t"><img src="assets/studio/script-scene-2.png" /></div>
          </div>
          <div id="note"><b>全流程直出：</b>导入剧本选定视觉风格，自动提取角色/场景/道具 2K 设定图与分镜提示词，一键生成实拍视频。</div>
        </div>

        <div id="right-vid">
          <video id="vid-s5" class="clip" src="assets/clips/script-demo.mp4" muted data-start="0" data-duration="8.5"></video>
          <div class="vtag">剧本工作室实拍 · Seedance 2.5 输出</div>
        </div>
      </div>

      <script>
        (() => {
          const root = document.currentScript.closest("[data-composition-id]") || document;
          const tl = gsap.timeline({ paused: true });

          tl.fromTo(root.querySelector("#head"), { y: -20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4 }, 0.05);
          tl.fromTo(root.querySelector("#ui-box"), { rotateY: 20, x: -50, opacity: 0 }, { rotateY: 6, x: 0, opacity: 1, duration: 0.85, ease: "expo.out" }, 0.12);
          tl.fromTo(root.querySelectorAll(".t"), { y: 20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, stagger: 0.07 }, 0.45);
          tl.fromTo(root.querySelector("#note"), { y: 20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4 }, 0.72);
          tl.fromTo(root.querySelector("#right-vid"), { rotateY: -20, x: 70, opacity: 0 }, { rotateY: -6, x: 0, opacity: 1, duration: 0.9, ease: "expo.out" }, 0.18);
          tl.to(root.querySelector("#right-vid"), { rotateY: -2, scale: 1.03, duration: 6.5, ease: "power1.inOut" }, 1.1);

          window.__timelines["s5-script-studio"] = tl;
          tl.seek(0);
        })();
      </script>
    </template>
  </body>
</html>
