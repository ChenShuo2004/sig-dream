<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: "SigCJK";
          src: local("PingFang SC"), local("Hiragino Sans GB"), local("STHeiti");
          font-weight: 400 900;
        }
        #root {
          position: absolute; inset: 0; overflow: hidden;
          background: radial-gradient(circle at 50% 48%, #180e2e 0%, #050508 55%, #010103 100%);
          font-family: Inter, "SigCJK", sans-serif; color: #ffffff;
          display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px;
        }
        #glow-ring {
          position: absolute; width: 560px; height: 560px; border-radius: 50%;
          background: radial-gradient(circle, rgba(139, 92, 246, 0.25) 0%, transparent 70%);
          filter: blur(40px); pointer-events: none;
        }
        #lockup { display: flex; align-items: center; gap: 26px; z-index: 4; }
        #lockup img {
          width: 102px; height: 102px; border-radius: 24px;
          box-shadow: 0 20px 60px rgba(139, 92, 246, 0.42);
        }
        #lockup span { font-size: 86px; font-weight: 900; letter-spacing: -0.04em; }
        #sub { font-size: 36px; font-weight: 600; color: #d4d4d8; z-index: 4; }
        #chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; max-width: 1480px; z-index: 4; }
        .chip {
          padding: 12px 24px; border-radius: 999px;
          background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(167, 139, 250, 0.3);
          font-size: 26px; font-weight: 600; color: #f4f4f5;
        }
        #repo {
          margin-top: 8px; padding: 18px 46px; border-radius: 999px; z-index: 4;
          background: linear-gradient(90deg, #7c3aed 0%, #4f46e5 100%);
          color: #ffffff; font-size: 32px; font-weight: 800;
          box-shadow: 0 20px 60px rgba(124, 58, 237, 0.45);
        }
      </style>

      <div id="root" data-composition-id="s9-endcard" data-start="0" data-duration="5.5" data-width="1920" data-height="1080">
        <div id="glow-ring"></div>
        <div id="lockup">
          <img src="assets/brand/icon.png" alt="sig-dream" />
          <span>sig-dream · sig画布</span>
        </div>
        <div id="sub">开源 · 零数据库 · 本地优先 AI 无限画布与视频创作工作室</div>
        <div id="chips">
          <div class="chip">无限画布</div>
          <div class="chip">剧本 / 复刻 / 替换工作室</div>
          <div class="chip">8 大 MCP Agent</div>
          <div class="chip">34+ 内置创作与动效 Skill</div>
          <div class="chip">桌面端 / 便携包 / Docker</div>
          <div class="chip">MIT 开源免费</div>
        </div>
        <div id="repo">★ github.com/ChenShuo2004/sig-dream</div>
      </div>

      <script>
        (() => {
          const root = document.currentScript.closest("[data-composition-id]") || document;
          const tl = gsap.timeline({ paused: true });

          tl.fromTo(root.querySelector("#lockup"), { scale: 0.85, opacity: 0, y: 26 }, { scale: 1, opacity: 1, y: 0, duration: 0.65, ease: "expo.out" }, 0.1);
          tl.fromTo(root.querySelector("#sub"), { y: 20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45 }, 0.42);
          tl.fromTo(root.querySelectorAll(".chip"), { y: 18, opacity: 0 }, { y: 0, opacity: 1, duration: 0.34, stagger: 0.06 }, 0.62);
          tl.fromTo(root.querySelector("#repo"), { scale: 0.9, opacity: 0, y: 20 }, { scale: 1, opacity: 1, y: 0, duration: 0.5, ease: "back.out(1.4)" }, 0.95);

          window.__timelines["s9-endcard"] = tl;
          tl.seek(0);
        })();
      </script>
    </template>
  </body>
</html>
