<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: "SigCJK";
          src: local("PingFang SC"), local("Hiragino Sans GB"), local("STHeiti");
          font-weight: 400 900;
        }
        #root {
          position: absolute; inset: 0; overflow: hidden;
          background: radial-gradient(circle at 70% 48%, #1d1138 0%, #06050c 54%, #020204 100%);
          font-family: Inter, "SigCJK", sans-serif; color: #ffffff;
          perspective: 1600px;
        }
        #left {
          position: absolute; left: 110px; top: 120px; width: 690px; z-index: 15;
          display: flex; flex-direction: column; gap: 20px;
        }
        .kicker {
          align-self: flex-start; padding: 8px 20px; border-radius: 999px;
          background: rgba(139, 92, 246, 0.22); border: 1px solid rgba(167, 139, 250, 0.5);
          color: #d8b4fe; font-size: 26px; font-weight: 700;
        }
        .h1 { font-size: 62px; font-weight: 900; line-height: 1.15; letter-spacing: -0.03em; }
        .glow {
          background: linear-gradient(90deg, #c084fc 0%, #38bdf8 100%);
          -webkit-background-clip: text; color: transparent;
        }
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        .chip {
          padding: 15px 20px; border-radius: 14px;
          background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(167, 139, 250, 0.26);
          font-size: 26px; font-weight: 700; color: #f4f4f5;
          display: flex; align-items: center; justify-content: space-between;
        }
        .dot { width: 10px; height: 10px; border-radius: 50%; background: #38bdf8; box-shadow: 0 0 12px #38bdf8; }
        .protos { display: flex; gap: 14px; margin-top: 4px; }
        .proto {
          flex: 1; padding: 18px 20px; border-radius: 16px;
          background: rgba(139, 92, 246, 0.14); border: 1px solid rgba(167, 139, 250, 0.35);
        }
        .proto h4 { font-size: 25px; font-weight: 800; color: #c4b5fd; margin-bottom: 4px; }
        .proto p { font-size: 23px; color: #d4d4d8; }
        #stage-right {
          position: absolute; right: 70px; top: 120px; width: 970px; height: 840px;
          transform-style: preserve-3d;
        }
        #card {
          width: 100%; height: 100%; border-radius: 26px; overflow: hidden;
          border: 1.5px solid rgba(167, 139, 250, 0.38);
          box-shadow: 0 50px 140px rgba(0, 0, 0, 0.9), 0 0 80px rgba(139, 92, 246, 0.24);
          position: relative;
        }
        #card img { width: 100%; height: 100%; object-fit: cover; object-position: right top; }
        .sheen {
          position: absolute; top: -20%; left: -60%; width: 45%; height: 150%;
          background: linear-gradient(105deg, transparent 20%, rgba(255, 255, 255, 0.14) 50%, transparent 80%);
          transform: skewX(-18deg);
        }
      </style>

      <div id="root" data-composition-id="s4-agent-mcp" data-start="0" data-duration="8" data-width="1920" data-height="1080">
        <div id="left">
          <div class="kicker">03 / 07 · v0.3.3 Canvas Agent & MCP</div>
          <div class="h1">8 大 AI Agent<br /><span class="glow">直连画布</span>协同编排</div>
          <div class="grid">
            <div class="chip"><span>Codex CLI / App</span><span class="dot"></span></div>
            <div class="chip"><span>Claude Code</span><span class="dot"></span></div>
            <div class="chip"><span>Cursor</span><span class="dot"></span></div>
            <div class="chip"><span>Antigravity</span><span class="dot"></span></div>
            <div class="chip"><span>Grok Build</span><span class="dot"></span></div>
            <div class="chip"><span>OpenCode (新/旧)</span><span class="dot"></span></div>
            <div class="chip"><span>Muse Code / Pi</span><span class="dot"></span></div>
            <div class="chip"><span>通用 MCP 协议</span><span class="dot"></span></div>
          </div>
          <div class="protos">
            <div class="proto"><h4>本机 stdio</h4><p>随包分发，一键复制配置</p></div>
            <div class="proto"><h4>远程 Streamable HTTP</h4><p>Bearer Token 鉴权与防 SSRF</p></div>
          </div>
        </div>

        <div id="stage-right">
          <div id="card">
            <img src="assets/ui-v033/agent-connect-dark.jpg" alt="agent connect dark" />
            <div class="sheen" id="sh4"></div>
          </div>
        </div>
      </div>

      <script>
        (() => {
          const root = document.currentScript.closest("[data-composition-id]") || document;
          const tl = gsap.timeline({ paused: true });

          tl.fromTo(root.querySelector("#card"), { rotateY: -32, rotateX: 10, x: 140, opacity: 0 }, { rotateY: -14, rotateX: 4, x: 0, opacity: 1, duration: 1.05, ease: "expo.out" }, 0.05);
          tl.to(root.querySelector("#card"), { rotateY: -6, rotateX: 1, scale: 1.08, duration: 6.4, ease: "power1.inOut" }, 1.1);
          tl.fromTo(root.querySelector("#sh4"), { x: 0 }, { x: 2000, duration: 2.2, ease: "power2.inOut" }, 1.0);

          tl.fromTo(root.querySelector(".kicker"), { y: 20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4 }, 0.12);
          tl.fromTo(root.querySelector(".h1"), { y: 34, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "expo.out" }, 0.22);
          tl.fromTo(root.querySelectorAll(".chip"), { x: -24, opacity: 0 }, { x: 0, opacity: 1, duration: 0.32, stagger: 0.05 }, 0.45);
          tl.fromTo(root.querySelectorAll(".proto"), { y: 20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, stagger: 0.1 }, 0.95);

          window.__timelines["s4-agent-mcp"] = tl;
          tl.seek(0);
        })();
      </script>
    </template>
  </body>
</html>
