<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: "SigCJK";
          src: local("PingFang SC"), local("Hiragino Sans GB"), local("STHeiti");
          font-weight: 400 900;
        }
        #root {
          position: absolute; inset: 0; overflow: hidden;
          background: radial-gradient(circle at 65% 48%, #1b1035 0%, #06050c 52%, #020204 100%);
          font-family: Inter, "SigCJK", sans-serif; color: #ffffff;
          perspective: 1600px;
        }
        #left {
          position: absolute; left: 110px; top: 240px; width: 640px; z-index: 15;
          display: flex; flex-direction: column; gap: 22px;
        }
        .brand {
          display: flex; align-items: center; gap: 16px;
          font-size: 32px; font-weight: 800; color: #c4b5fd;
        }
        .brand img { width: 52px; height: 52px; border-radius: 14px; }
        .h1 { font-size: 72px; font-weight: 900; line-height: 1.15; letter-spacing: -0.03em; }
        .glow {
          background: linear-gradient(90deg, #c084fc 0%, #818cf8 50%, #38bdf8 100%);
          -webkit-background-clip: text; color: transparent;
        }
        .sub { font-size: 30px; color: #a1a1aa; line-height: 1.5; }
        #stage {
          position: absolute; right: 60px; top: 140px; width: 1100px; height: 800px;
          transform-style: preserve-3d;
        }
        #card {
          width: 100%; height: 100%; border-radius: 26px; overflow: hidden;
          border: 1.5px solid rgba(167, 139, 250, 0.35);
          box-shadow: 0 50px 140px rgba(0, 0, 0, 0.9), 0 0 90px rgba(139, 92, 246, 0.24);
          position: relative;
        }
        #card img { width: 100%; height: 100%; object-fit: cover; object-position: left top; }
        .sheen {
          position: absolute; top: -20%; left: -60%; width: 45%; height: 150%;
          background: linear-gradient(105deg, transparent 20%, rgba(255, 255, 255, 0.14) 50%, transparent 80%);
          transform: skewX(-18deg);
        }
      </style>

      <div id="root" data-composition-id="s1-intro" data-start="0" data-duration="5.5" data-width="1920" data-height="1080">
        <div id="left">
          <div class="brand"><img src="assets/brand/icon.png" /><span>sig-dream · v0.3.3 全功能介绍</span></div>
          <div class="h1">本地优先 AI<br /><span class="glow">无限画布</span>工作室</div>
          <div class="sub">MIT 开源 · 零数据库 · 数据与 Key 全留本机<br />把生图、视频、三大工作室与 Agent 融为一体</div>
        </div>
        <div id="stage">
          <div id="card">
            <img src="assets/ui-v033/home-dark.jpg" alt="home dark" />
            <div class="sheen" id="sh1"></div>
          </div>
        </div>
      </div>

      <script>
        (() => {
          const root = document.currentScript.closest("[data-composition-id]") || document;
          const tl = gsap.timeline({ paused: true });

          tl.fromTo(root.querySelector("#card"), { rotateY: -34, rotateX: 12, x: 160, opacity: 0 }, { rotateY: -16, rotateX: 5, x: 0, opacity: 1, duration: 1.15, ease: "expo.out" }, 0.05);
          tl.to(root.querySelector("#card"), { rotateY: -8, rotateX: 2, scale: 1.07, duration: 3.8, ease: "power1.inOut" }, 1.2);
          tl.fromTo(root.querySelector("#sh1"), { x: 0 }, { x: 2100, duration: 2.2, ease: "power2.inOut" }, 0.8);
          tl.fromTo(root.querySelector(".brand"), { y: 20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45 }, 0.2);
          tl.fromTo(root.querySelector(".h1"), { y: 36, opacity: 0 }, { y: 0, opacity: 1, duration: 0.55, ease: "expo.out" }, 0.35);
          tl.fromTo(root.querySelector(".sub"), { y: 20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45 }, 0.6);

          window.__timelines["s1-intro"] = tl;
          tl.seek(0);
        })();
      </script>
    </template>
  </body>
</html>
