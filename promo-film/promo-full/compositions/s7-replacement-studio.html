<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: "SigCJK";
          src: local("PingFang SC"), local("Hiragino Sans GB"), local("STHeiti");
          font-weight: 400 900;
        }
        #root {
          position: absolute; inset: 0; overflow: hidden;
          background: radial-gradient(circle at 70% 50%, #1d1138 0%, #06050c 54%, #020204 100%);
          font-family: Inter, "SigCJK", sans-serif; color: #ffffff;
          perspective: 1600px;
        }
        #head {
          position: absolute; left: 110px; top: 52px; right: 110px;
          display: flex; align-items: center; justify-content: space-between; z-index: 20;
        }
        .kicker {
          padding: 8px 20px; border-radius: 999px;
          background: rgba(139, 92, 246, 0.22); border: 1px solid rgba(167, 139, 250, 0.5);
          color: #d8b4fe; font-size: 26px; font-weight: 700;
        }
        .htitle { font-size: 46px; font-weight: 900; letter-spacing: -0.03em; }
        .glow {
          background: linear-gradient(90deg, #c084fc 0%, #38bdf8 100%);
          -webkit-background-clip: text; color: transparent;
        }
        #left {
          position: absolute; left: 110px; top: 155px; width: 1040px;
          display: flex; flex-direction: column; gap: 20px; transform-style: preserve-3d;
        }
        #repl-ui {
          height: 540px; border-radius: 24px; overflow: hidden;
          border: 1.5px solid rgba(167, 139, 250, 0.35);
          box-shadow: 0 36px 100px rgba(0, 0, 0, 0.85);
        }
        #repl-ui img { width: 100%; height: 100%; object-fit: cover; }
        #modes { display: grid; grid-template-columns: repeat(2, 1fr); gap: 18px; }
        .mode {
          padding: 22px 26px; border-radius: 18px;
          background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(167, 139, 250, 0.25);
        }
        .mode h3 { font-size: 28px; font-weight: 800; color: #ffffff; margin-bottom: 6px; }
        .mode p { font-size: 24px; color: #a1a1aa; line-height: 1.45; }
        #phone {
          position: absolute; right: 120px; top: 150px; width: 472px; height: 840px;
          border-radius: 28px; overflow: hidden;
          border: 2px solid rgba(167, 139, 250, 0.45);
          box-shadow: 0 44px 120px rgba(0, 0, 0, 0.9), 0 0 80px rgba(139, 92, 246, 0.24);
        }
        #phone video { width: 100%; height: 100%; object-fit: cover; }
        .ptag {
          position: absolute; left: 18px; right: 18px; bottom: 18px; text-align: center;
          padding: 10px 16px; border-radius: 12px;
          background: rgba(5, 5, 10, 0.86); border: 1px solid rgba(255, 255, 255, 0.16);
          font-size: 24px; font-weight: 700;
        }
      </style>

      <div id="root" data-composition-id="s7-replacement-studio" data-start="0" data-duration="8" data-width="1920" data-height="1080">
        <div id="head">
          <div class="kicker">06 / 07 · 替换工作室</div>
          <div class="htitle">视频人物像素级替换 + <span class="glow">IndexTTS 声音克隆</span></div>
        </div>

        <div id="left">
          <div id="repl-ui"><img src="assets/ui/studio-replacement-dark.png" alt="replacement dark" /></div>
          <div id="modes">
            <div class="mode"><h3>模式一：人物与声音全替换</h3><p>框选识别原片人物，拖拽角色卡精准替换，手部遮挡与光影自然一致。</p></div>
            <div class="mode"><h3>模式二：仅声音克隆与配音</h3><p>跨多模型与 RunningHub 工作流，原片英文视频无缝改配中文口播。</p></div>
          </div>
        </div>

        <div id="phone">
          <video id="vid-s7" class="clip" src="assets/clips/replacement-demo.mp4" muted data-start="0" data-duration="8"></video>
          <div class="ptag">替换成片实拍 · 角色与声音同步</div>
        </div>
      </div>

      <script>
        (() => {
          const root = document.currentScript.closest("[data-composition-id]") || document;
          const tl = gsap.timeline({ paused: true });

          tl.fromTo(root.querySelector("#head"), { y: -20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4 }, 0.05);
          tl.fromTo(root.querySelector("#repl-ui"), { rotateY: 18, x: -50, opacity: 0 }, { rotateY: 5, x: 0, opacity: 1, duration: 0.85, ease: "expo.out" }, 0.12);
          tl.fromTo(root.querySelectorAll(".mode"), { y: 22, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, stagger: 0.14 }, 0.45);
          tl.fromTo(root.querySelector("#phone"), { rotateY: -24, x: 70, opacity: 0 }, { rotateY: -8, x: 0, opacity: 1, duration: 0.9, ease: "expo.out" }, 0.18);
          tl.to(root.querySelector("#phone"), { rotateY: -3, scale: 1.03, duration: 6.2, ease: "power1.inOut" }, 1.1);

          window.__timelines["s7-replacement-studio"] = tl;
          tl.seek(0);
        })();
      </script>
    </template>
  </body>
</html>
