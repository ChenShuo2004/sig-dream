        (() => {
          const tl = gsap.timeline({ paused: true });

          gsap.set("#s1-cursor", { x: 1980, y: 880 });

          // Frame 0 is immediately bright, minimal, and populated! Subtle staggered settle on the 3 character sheets:
          ["#s1-c1", "#s1-c2", "#s1-c3"].forEach((sel, idx) => {
            tl.fromTo(
              sel,
              { x: 48, opacity: 0.9 },
              { x: 0, opacity: 1, duration: 0.45, ease: "expo.out" },
              idx * 0.12,
            );
          });

          // Gentle floating gallery drift so there is zero dead stretch while reading headline
          tl.fromTo(
            "#s1-gallery",
            { y: 8 },
            { y: -8, duration: 3.6, ease: "power1.inOut" },
            0.4,
          );

          // Cursor enters at 3.25s and clicks "进入无限画布 →" at 3.80s

            "#s1-cursor",
            { x: 1980, y: 880, opacity: 1 },
            { x: 295, y: 695, opacity: 1, duration: 0.52, ease: "power3.out" },
            3.25,
          );
          tl.fromTo(
            "#s1-cta",
            { scale: 1, backgroundColor: "#111111" },
            { scale: 0.93, backgroundColor: "#c86d44", duration: 0.08, ease: "power2.in" },
            3.8,
          );
          tl.fromTo(
            "#s1-cta",
            { scale: 0.93 },
            { scale: 1.04, duration: 0.14, ease: "power2.out", immediateRender: false },
            3.88,
          );

          // Clean white zoom-handoff at 4.24s..4.50s
          tl.fromTo(
            "#s1-left",
            { x: 0, opacity: 1 },
            { x: -90, opacity: 0.3, duration: 0.24, ease: "power3.in" },
            4.24,
          );
          tl.fromTo(
            "#s1-gallery",
            { scale: 1, opacity: 1 },
            { scale: 1.12, opacity: 0.35, duration: 0.24, ease: "power3.in", immediateRender: false },
            4.24,
          );

          window.__timelines["s1-hook"] = tl;
        })();
