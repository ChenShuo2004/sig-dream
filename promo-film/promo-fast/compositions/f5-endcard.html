<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: "SigCJK";
          src: local("PingFang SC"), local("Hiragino Sans GB"), local("STHeiti");
          font-weight: 400 900;
        }
        #root {
          position: absolute; inset: 0; overflow: hidden;
          background: radial-gradient(circle at 50% 48%, #180e2e 0%, #050508 55%, #010103 100%);
          font-family: Inter, "SigCJK", sans-serif; color: #ffffff;
          display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px;
        }
        #glow-ring {
          position: absolute; width: 520px; height: 520px; border-radius: 50%;
          background: radial-gradient(circle, rgba(139, 92, 246, 0.25) 0%, transparent 70%);
          filter: blur(36px); pointer-events: none;
        }
        #brand-row { display: flex; align-items: center; gap: 26px; z-index: 4; }
        #brand-row img {
          width: 102px; height: 102px; border-radius: 24px;
          box-shadow: 0 20px 60px rgba(139, 92, 246, 0.42);
        }
        #brand-row span { font-size: 90px; font-weight: 900; letter-spacing: -0.04em; }
        #claim { font-size: 36px; font-weight: 600; color: #d4d4d8; z-index: 4; }
        #repo {
          margin-top: 8px; padding: 18px 46px; border-radius: 999px; z-index: 4;
          background: linear-gradient(90deg, #7c3aed 0%, #4f46e5 100%);
          color: #ffffff; font-size: 32px; font-weight: 800;
          box-shadow: 0 20px 60px rgba(124, 58, 237, 0.45);
        }
      </style>

      <div id="root" data-composition-id="f5-endcard" data-start="0" data-duration="4.5" data-width="1920" data-height="1080">
        <div id="glow-ring"></div>
        <div id="brand-row">
          <img src="assets/brand/icon.png" alt="sig-dream" />
          <span>sig-dream · sig画布</span>
        </div>
        <div id="claim">MIT 开源 · 零数据库 · 34+ 内置创作与动效 Skill</div>
        <div id="repo">★ github.com/ChenShuo2004/sig-dream</div>
      </div>

      <script>
        (() => {
          const root = document.currentScript.closest("[data-composition-id]") || document;
          const tl = gsap.timeline({ paused: true });

          tl.fromTo(root.querySelector("#brand-row"), { scale: 0.82, opacity: 0, y: 24 }, { scale: 1, opacity: 1, y: 0, duration: 0.65, ease: "expo.out" }, 0.1);
          tl.fromTo(root.querySelector("#claim"), { y: 20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45 }, 0.45);
          tl.fromTo(root.querySelector("#repo"), { scale: 0.9, opacity: 0, y: 20 }, { scale: 1, opacity: 1, y: 0, duration: 0.5, ease: "back.out(1.4)" }, 0.72);

          window.__timelines["f5-endcard"] = tl;
          tl.seek(0);
        })();
      </script>
    </template>
