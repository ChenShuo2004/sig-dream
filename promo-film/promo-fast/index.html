<!doctype html>
<html
  lang="zh-CN"
  data-composition-variables='[
    {"id":"brand_name","type":"string","label":"Brand Name","default":"sig-dream"},
    {"id":"repo_url","type":"string","label":"GitHub Repo","default":"github.com/ChenShuo2004/sig-dream"},
    {"id":"accent_color","type":"color","label":"Accent Color","default":"#8b5cf6"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>sig-dream v0.3.3 — 32s 3D Cinematic Fast Promo</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "SigCJK";
        src: local("PingFang SC"), local("Hiragino Sans GB"), local("STHeiti");
        font-weight: 400 900;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1920px; height: 1080px; overflow: hidden;
        background: #030306; color: #ffffff;
        font-family: Inter, "SigCJK", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #030306; }
      #base-ground {
        position: absolute; inset: 0; z-index: 0;
        background: radial-gradient(circle at 50% 45%, #120d1f 0%, #050508 55%, #020204 100%);
      }
      .scene-host { position: absolute; inset: 0; }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="32"
      data-width="1920"
      data-height="1080"
      data-fps="30"
      data-motion-blur="on"
    >
      <div id="base-ground" data-layout-ignore></div>

      <!-- 5 High-Impact 3D Cinematic Scenes (32.0s) -->
      <div id="f1-hook" class="clip scene-host" data-composition-id="f1-hook" data-composition-src="compositions/f1-hook.html" data-start="0" data-duration="4.5" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index: 1"></div>
      <div id="f2-canvas-burst" class="clip scene-host" data-composition-id="f2-canvas-burst" data-composition-src="compositions/f2-canvas-burst.html" data-start="4.5" data-duration="6.5" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index: 2"></div>
      <div id="f3-agent-mcp" class="clip scene-host" data-composition-id="f3-agent-mcp" data-composition-src="compositions/f3-agent-mcp.html" data-start="11" data-duration="5" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index: 3"></div>
      <div id="f4-studios-montage" class="clip scene-host" data-composition-id="f4-studios-montage" data-composition-src="compositions/f4-studios-montage.html" data-start="16" data-duration="11.5" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index: 4"></div>
      <div id="f5-endcard" class="clip scene-host" data-composition-id="f5-endcard" data-composition-src="compositions/f5-endcard.html" data-start="27.5" data-duration="4.5" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index: 5"></div>

      <!-- Track 2: User Provided BGM (背景音乐1.mp3) -->
      <audio
        id="bgm-user"
        class="clip"
        src="assets/audio/user-bgm-1.mp3"
        data-start="0"
        data-duration="32"
        data-track-index="2"
        data-volume="0.88"
        data-fade-in="0.15"
        data-fade-out="1.8"
      ></audio>

      <!-- Track 3-4: Subtle Cinematic Whoosh & Impact Accents -->
      <audio id="sfx-open" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="0.1" data-duration="1.5" data-track-index="3" data-volume="0.34"></audio>
      <audio id="sfx-w1" class="clip" src="assets/sfx/whoosh.mp3" data-start="4.3" data-duration="0.55" data-track-index="4" data-volume="0.35"></audio>
      <audio id="sfx-drop" class="clip" src="assets/sfx/impact-bass-2.mp3" data-start="7.0" data-duration="2.0" data-track-index="3" data-volume="0.38"></audio>
      <audio id="sfx-w2" class="clip" src="assets/sfx/whoosh.mp3" data-start="10.8" data-duration="0.55" data-track-index="4" data-volume="0.35"></audio>
      <audio id="sfx-w3" class="clip" src="assets/sfx/whoosh.mp3" data-start="15.8" data-duration="0.55" data-track-index="4" data-volume="0.35"></audio>
      <audio id="sfx-cut1" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="19.7" data-duration="0.45" data-track-index="3" data-volume="0.34"></audio>
      <audio id="sfx-cut2" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="23.5" data-duration="0.45" data-track-index="3" data-volume="0.34"></audio>
      <audio id="sfx-end" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="27.5" data-duration="1.8" data-track-index="4" data-volume="0.38"></audio>
    </div>

    <script>
      (() => {
        const tl = gsap.timeline({ paused: true });
        window.__timelines["main"] = tl;
        tl.seek(0);
      })();
    </script>
  </body>
</html>
