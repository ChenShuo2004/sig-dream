# Large generated files are sendfile'd from disk.
# Proxying the body through uvicorn on HTTP/2 makes the browser report "Failed to fetch"
# even when nginx has already written the full file.

location = /_canvas_media_auth {
    internal;
    proxy_method GET;
    proxy_pass http://127.0.0.1:8000/canvas-api/media-auth;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}

location ^~ /internal-canvas-media/ {
    internal;
    auth_request /_canvas_media_auth;
    alias /tmp/ai007-canvas-media/;
    gzip off;
    sendfile on;
    tcp_nopush on;
    types {
        video/mp4 mp4;
        video/webm webm;
        video/quicktime mov;
        image/png png;
        image/jpeg jpg jpeg;
        image/webp webp;
        image/gif gif;
    }
    default_type application/octet-stream;
}

location ^~ /canvas-api/runninghub/cached-result/ {
    rewrite "^/canvas-api/runninghub/cached-result/(rh-[A-Za-z0-9_-]{8,80}\\.(?:mp4|webm|mov))$" /internal-canvas-media/$1 last;
    return 404;
}

location ^~ /canvas-api/generated-media/ {
    rewrite "^/canvas-api/generated-media/(gen-[A-Za-z0-9_-]{8,80}\\.(?:mp4|webm|mov|png|jpe?g|webp|gif))$" /internal-canvas-media/$1 last;
    return 404;
}
